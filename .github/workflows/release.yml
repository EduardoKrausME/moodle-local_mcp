name: Auto-release via commit message

on: [push]

permissions:
  contents: write

jobs:
  auto-release:
    if: startsWith(github.event.head_commit.message, 'V ')
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from commit message
        id: ver
        shell: bash
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -Eq '^V [0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(echo "$MSG" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid release version in commit message: '$MSG'."
          fi

      - name: Build clean Moodle plugin archive
        if: steps.ver.outputs.version != ''
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          rm -rf package
          mkdir -p package/ai_bridge
          git archive --format=tar HEAD | tar -x -C package/ai_bridge
          rm -rf package/ai_bridge/.github
          (
            cd package
            zip -rq "../local_ai_bridge_${VERSION}.zip" ai_bridge
          )
          if unzip -l "local_ai_bridge_${VERSION}.zip" | grep -q '/\.git/'; then
            echo "The release archive unexpectedly contains .git."
            exit 1
          fi

      - name: Create annotated tag
        if: steps.ver.outputs.version != ''
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            Release ${{ steps.ver.outputs.version }} automatically generated from commit
            ${{ github.event.head_commit.id }}.
          files: local_ai_bridge_${{ steps.ver.outputs.version }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
